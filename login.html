<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Personal Login | Hussain Shah</title>
<style>
:root{color-scheme:dark;--text:#f4f7ff;--muted:#aab4d0;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 15% 20%,#253269 0,transparent 45%),radial-gradient(ellipse at 90% 80%,#35235e 0,transparent 45%),#0b1020;min-height:100svh;display:grid;place-items:center;padding:24px}a{color:#b7c5ff;text-decoration:none}.shell{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:rgba(18,26,48,.85);box-shadow:0 24px 90px #0005;animation:enter .6s ease both}.intro{padding:48px 38px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#6c8cff20,#8f5cff20)}.brand{font-size:24px;font-weight:800}.brand span{color:#8fa3ff}.badge{margin:48px 0 16px;font-size:12px;letter-spacing:2px;color:#b7c5ff}h1{font-size:40px;line-height:1.15;margin:0 0 18px;letter-spacing:-1px}.intro p{color:var(--muted);line-height:1.7;margin:0}.back{display:inline-block;margin-top:36px;font-size:14px}.form-panel{padding:48px 38px}h2{margin:0 0 8px;font-size:27px}.sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 28px}label{display:block;font-size:14px;margin:20px 0 9px;font-weight:600}input{width:100%;border:1px solid var(--line);border-radius:12px;background:#0b102080;color:var(--text);padding:14px;font:inherit;min-width:0}input:focus{outline:2px solid #8fa3ff;outline-offset:2px}.password{position:relative}.password input{padding-right:72px}.show{position:absolute;right:8px;top:7px;padding:8px;background:transparent;border:0;color:#b7c5ff;font:inherit;font-size:13px;cursor:pointer}.submit{margin-top:28px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#6c8cff,#8f5cff);color:white;font:inherit;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s}.submit:hover{transform:translateY(-2px);box-shadow:0 10px 30px #6c8cff40}button:focus-visible,a:focus-visible{outline:2px solid #5de0ff;outline-offset:4px}.note{font-size:12px;color:var(--muted);line-height:1.6;margin:20px 0 0}.status{font-size:14px;line-height:1.6;color:#c9d4ff;margin-top:18px}[hidden]{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}@media(max-width:680px){.shell{grid-template-columns:1fr}.intro,.form-panel{padding:28px}.badge{margin-top:24px}h1{font-size:30px}.back{margin-top:20px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main class="shell"><section class="intro"><a class="brand" href="/">Hussain<span>.</span></a><div class="badge">PERSONAL SPACE</div><h1>Welcome back,<br>Hussain.</h1><p>Your ideas. Your work. Your next chapter.</p><a class="back" href="/">← Back to portfolio</a></section><section class="form-panel" aria-labelledby="login-title"><h2 id="login-title">Personal login</h2><p class="sub">Enter your details below.</p><form id="login-form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required><label for="password">Password</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="show" id="show-password" type="button" aria-controls="password" aria-pressed="false">Show</button></div><button class="submit" type="submit">Log in →</button><p class="note">Login page preview. Sign-in is not connected yet. Your details are not sent or saved.</p><p class="status" id="status" role="status" hidden></p></form></section></main><script>
const password=document.getElementById('password'),toggle=document.getElementById('show-password');
toggle.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.textContent=show?'Hide':'Show';toggle.setAttribute('aria-pressed',String(show));});
document.getElementById('login-form').addEventListener('submit',event=>{event.preventDefault();password.value='';const status=document.getElementById('status');status.hidden=false;status.textContent='This page is ready. Personal sign-in needs to be connected before you can log in.';});
</script></body></html>
