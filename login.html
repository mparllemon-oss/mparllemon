gin-top:18px}.message:empty{display:none}@media(max-width:700px){main{max-width:440px;grid-template-columns:1fr}.intro{min-height:auto;padding:26px 28px}.intro h1{font-size:32px;letter-spacing:-1px;margin:25px 0 8px}.intro p{margin:0;max-width:none}.small{display:none}.form-panel{padding:30px 28px}body{padding:16px}h2{font-size:28px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}.tabs{display:flex;background:#eef3fa;padding:5px;border-radius:12px;margin-bottom:25px;gap:5px}.tabs button{flex:1;border:0;background:transparent;padding:11px;font:600 14px system-ui;color:#63718a;border-radius:8px;cursor:pointer}.tabs .active{background:white;color:#2563eb;box-shadow:0 2px 6px #12284e12}#welcome{width:min(440px,100%);background:white;border-radius:24px;padding:36px;box-shadow:0 24px 70px #142e5d18}#welcomeEmail{overflow-wrap:anywhere}#welcome{width:min(1050px,100%);padding:0;overflow:hidden}.dash-header{padding:24px 32px;background:#12284e;color:white;display:flex;align-items:center;justify-content:space-between;gap:16px}.logout{background:#ffffff12;border:1px solid #ffffff40;color:white;padding:10px 18px;border-radius:10px;font:600 14px system-ui;cursor:pointer}.logout:hover{background:#ffffff25}.dash-content{padding:40px}.dash-title{font-size:38px;margin-top:12px}.account-card{display:flex;align-items:center;gap:20px;padding:25px;border:1px solid #dbe4f1;border-radius:18px;margin:30px 0;background:#f8fbff}.avatar{display:grid;place-items:center;background:#2563eb;color:white;border-radius:18px;min-width:64px;height:64px;font-size:22px;font-weight:700}h3{margin:0 0 8px;font-size:18px}#welcomeEmail{margin:0 0 12px;color:#536780}.demo-badge{font-size:14px;color:#245ac5;background:#e7efff;padding:5px 10px;border-radius:6px}.dashboard-note{padding:25px 0;border-top:1px solid #e3eaf4}.dashboard-note p{color:#657187}@media(max-width:700px){.dash-header{padding:20px}.dash-content{padding:25px}.dash-header .brand{font-size:14px}.account-card{padding:18px;gap:14px}.dash-title{font-size:32px}} body{background:radial-gradient(ellipse at 15% 20%,#253269 0,transparent 45%),radial-gradient(ellipse at 90% 80%,#35235e 0,transparent 45%),#0b1020;color:#f4f7ff;color-scheme:dark}main,#welcome{background:#121a30}.intro,.dash-header{background:#0e1730}.brand{text-decoration:none;color:inherit}.back{color:#b7c5ff;text-decoration:none;font-size:14px;margin-top:28px}.eyebrow{color:#a6b7ff}.subtitle,.note,.dashboard-note p{color:#aab4d0}input{background:#0b1020;border-color:#ffffff26;color:#f4f7ff}.show{color:#b7c5ff}.submit{background:linear-gradient(135deg,#6c8cff,#8f5cff)}.submit:hover{background:#6c8cff}.tabs{background:#0b1020}.tabs button{color:#aab4d0}.tabs .active{background:#273353;color:white}.account-card{background:#0b102080;border-color:#ffffff20}#welcomeEmail{color:#c2cdeb}.dashboard-note{border-color:#ffffff20}.demo-badge{background:#283568;color:#d2dcff}.portfolio-link{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:10px;background:#6c8cff;color:white;text-decoration:none;font-weight:600} button:disabled{opacity:.6;cursor:wait;transform:none}.message{background:#283568;color:#d2dcff}</style></head><body><main><section class="intro"><div class="brand"><span class="monogram">HS</span>Hussain Shah</div><div><h1>Your space.<br>Your next step.</h1><p>Welcome to your personal portfolio.</p></div><span class="back">Log in to explore my portfolio.</span></section><section class="form-panel"><span class="eyebrow">WELCOME BACK</span><div class="tabs" role="group" aria-label="Choose a screen"><button type="button" id="loginTab" class="active" aria-pressed="true">Log in</button><button type="button" id="signupTab" aria-pressed="false">Sign up</button></div><h2 id="heading">Log in</h2><p class="subtitle">Enter your details to continue.</p><form id="login"><div class="field" id="nameField" hidden><label for="name">Full name</label><input id="name" autocomplete="name" placeholder="Your name" maxlength="80"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="username" required></div><div class="field"><label for="password">Password</label><div class="password"><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required><button class="show" type="button" id="show" aria-pressed="false" aria-label="Show password">Show</button></div></div><button class="submit" type="submit" id="submit">Log in</button><div id="message" class="message" role="status" aria-live="polite"></div></form><p class="note">Create an account first, then log in with your email and password.</p></section></main><script type="module">
const form=document.getElementById('login'),password=document.getElementById('password'),toggle=document.getElementById('show'),message=document.getElementById('message');let mode='login';
function setMode(next){mode=next;const signup=mode==='signup';form.reset();password.type='password';toggle.textContent='Show';toggle.setAttribute('aria-pressed','false');toggle.setAttribute('aria-label','Show password');document.getElementById('nameField').hidden=!signup;document.getElementById('name').required=signup;document.getElementById('heading').textContent=signup?'Create an account':'Log in';document.getElementById('submit').textContent=signup?'Sign up':'Log in';password.autocomplete=signup?'new-password':'current-password';message.textContent='';for(const id of ['loginTab','signupTab']){const active=id===(signup?'signupTab':'loginTab');document.getElementById(id).classList.toggle('active',active);document.getElementById(id).setAttribute('aria-pressed',String(active));}}
document.getElementById('loginTab').addEventListener('click',()=>setMode('login'));document.getElementById('signupTab').addEventListener('click',()=>setMode('signup'));
toggle.addEventListener('click',()=>{const visible=password.type==='password';password.type=visible?'text':'password';toggle.textContent=visible?'Hide':'Show';toggle.setAttribute('aria-pressed',String(visible));toggle.setAttribute('aria-label',visible?'Hide password':'Show password')});

import {loadFirebaseAuth,authError} from './firebase-auth.js';
const submit=document.getElementById('submit');
let firebase=null,busy=false;
submit.disabled=true;
const startupTimer=setTimeout(()=>{if(!firebase)message.textContent='Connection is taking longer than expected. Check your internet and refresh.';},15000);
loadFirebaseAuth().then(async sdk=>{
  await sdk.auth.authStateReady();
  firebase=sdk;
  clearTimeout(startupTimer);
  submit.disabled=false;
  message.textContent='';
  sdk.onAuthStateChanged(sdk.auth,user=>{if(user&&!busy)location.replace('index.html#home');});
}).catch(error=>{clearTimeout(startupTimer);message.textContent='Could not load login. Check your internet and refresh.';});
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(busy||!form.reportValidity())return;
  if(!firebase){message.textContent='Login is still connecting. Please wait.';return;}
  const name=document.getElementById('name').value.trim();
  if(mode==='signup'&&!name){message.textContent='Please enter your name.';return;}
  busy=true;submit.disabled=true;
  document.getElementById('loginTab').disabled=true;document.getElementById('signupTab').disabled=true;
  message.textContent=mode==='signup'?'Creating your account…':'Logging in…';
  try{
    const email=document.getElementById('email').value.trim();
    if(mode==='signup'){
      const account=await firebase.createUserWithEmailAndPassword(firebase.auth,email,password.value);
      try{await firebase.updateProfile(account.user,{displayName:name});}catch(profileError){}
    }else{
      await firebase.signInWithEmailAndPassword(firebase.auth,email,password.value);
    }
    password.value='';
    location.replace('index.html#home');
  }catch(error){
    message.textContent=authError(error);
  }finally{
    busy=false;submit.disabled=false;
    document.getElementById('loginTab').disabled=false;document.getElementById('signupTab').disabled=false;
  }
});
</script></body></html>
