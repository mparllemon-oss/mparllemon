<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake · Hussain Shah</title><link rel="stylesheet" href="scores.css"></head><body><main class="panel"><a href="index.html#projects">← Portfolio</a><h1>Snake Game</h1><p id="player">Connecting your account…</p><div class="stats"><span>Score: <strong id="score">0</strong></span><span id="level">Level 1</span></div><canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas><p id="status" role="status" aria-live="polite">Log in to play and save your score.</p><div class="actions"><button id="start" disabled>Play</button><button id="pause" disabled>Pause</button><button id="retry" hidden>Retry saving</button><a href="scores.html">Player scores</a></div><div class="pad" aria-label="Game controls"><button data-dir="up" aria-label="Move up">↑</button><div><button data-dir="left" aria-label="Move left">←</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div></div><p class="muted">Arrow keys or WASD to steer. Space to pause. Hitting a wall ends the game. Speed increases every 3 points.</p><form id="name-form" hidden><label for="player-name">Your player name</label><input id="player-name" maxlength="80" required autocomplete="name"><button>Save name</button></form></main><script type="module" src="snake.js"></script></body></html>
